    <script>
      (function () {
        try {
          var theme = localStorage.getItem('portfolio-theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  </body>
