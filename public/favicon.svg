<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="2.5" />

  <!-- Code brackets / Monogram <JK/> -->
  <path d="M16 24L8 32L16 40" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M48 24L56 32L48 40" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- J K letters -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-0.5">JK</text>
</svg>
